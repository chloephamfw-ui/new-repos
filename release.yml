name: Auto-generate release notes

on:
  push:
    tags:
      - "v0.1"

permissions:
  contents: write

jobs:
  generate-release-notes:
    runs-on: new-repos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v0.1
        with:
          fetch-depth: 0

      - name: Generate release notes and draft release
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const currentTag = context.ref.replace('refs/tags/', '')

            // 1. Lấy danh sách tag
            const tags = await github.rest.repos.listTags({
              owner,
              repo,
              per_page: 10
            })

            if (tags.data.length < 2) {
              core.setFailed('Không đủ tag để so sánh commit')
              return
            }

            // Tag hiện tại là tag mới push → lấy tag trước đó
            const previousTag = tags.data[1].name

            // 2. Lấy commit giữa 2 tag
            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: previousTag,
              head: currentTag
            })

            const commits = comparison.data.commits

            // 3. Phân loại commit
            const added = []
            const modified = []
            const removed = []

            for (const commit of commits) {
              const msg = commit.commit.message.toLowerCase()

              if (msg.includes('add') || msg.includes('create')) {
                added.push(`- ${commit.commit.message}`)
              } else if (
                msg.includes('update') ||
                msg.includes('modify') ||
                msg.includes('alter')
              ) {
                modified.push(`- ${commit.commit.message}`)
              } else if (
                msg.includes('remove') ||
                msg.includes('delete') ||
                msg.includes('drop')
              ) {
                removed.push(`- ${commit.commit.message}`)
              }
            }

            // 4. Tạo nội dung release notes
            const releaseBody = `
            ## 🆕 Added
            ${added.length ? added.join('\n') : '- Không có thay đổi'}

            ## ✏️ Modified
            ${modified.length ? modified.join('\n') : '- Không có thay đổi'}

            ## ❌ Removed
            ${removed.length ? removed.join('\n') : '- Không có thay đổi'}
            `

            // 5. Tạo Draft Release
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: currentTag,
              name: `Release ${currentTag}`,
              body: releaseBody,
              draft: true,
              prerelease: false
            })
